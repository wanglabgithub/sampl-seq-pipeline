name: sampl-seq

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Python and command-line tools
  - python=3.9.23
  - pandas=2.3.1
  - ultraplex=1.2.5
  - seqkit=2.13.0
  - vsearch=2.31.0
  - pigz=2.8

  # Utilities used during installation
  - curl
  - ca-certificates
  - coreutils

  # R and R packages
  - r-base=4.4.3
  - bioconductor-dnabarcodes=1.36.0
  - r-data.table=1.18.4
  - r-dplyr=1.2.1
  - r-doparallel=1.0.17
  - r-dorng=1.8.6.3
  - r-foreach=1.5.2
  - r-jsonlite=2.0.0
  - r-mass=7.3_66
  - r-paralleldist=0.2.7
  - r-readr=2.2.0
  - r-remotes=2.5.0
  - r-tibble=3.3.1
  - r-tidyr=1.3.2

# USEARCH 12 is installed separately by:
# bash scripts/setup/install_usearch12.sh
